<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawsuits Challenging Age Verification Laws in the US</title>
  
  <!-- Custom Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- D3 & TopoJSON for Realistic Mapping -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <style>
    .ltrk {
      --paper: #ffffff;
      --card: #ffffff;
      --ink: #111827;
      --soft: #6b7280;
      --rule: #e5e7eb;
      --seal: #2563eb;
      --seal-tint: #f0fdf4;
      --accent-bg: #f8fafc;
      --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      background: var(--paper); color: var(--ink); font-family: var(--body);
      font-size: 15px; line-height: 1.6; padding: 24px; margin: 0 auto; max-width: 1200px;
    }
    .ltrk *, .ltrk *::before, .ltrk *::after { box-sizing: border-box; }
    .ltrk p, .ltrk h1, .ltrk h2, .ltrk h3, .ltrk dl, .ltrk dd { margin: 0; }
    .ltrk button, .ltrk input, .ltrk select { font: inherit; color: inherit; }
    .ltrk [hidden] { display: none !important; }
    .ltrk-sr { position: absolute; left: -9999px; }

    /* Header Layout with Map */
    .ltrk-header-grid {
      display: grid;
      grid-template-columns: 1fr minmax(320px, 400px);
      gap: 24px;
      align-items: start;
      margin-bottom: 20px;
    }

    .ltrk h1 { font-weight: 700; font-size: clamp(24px, 4vw, 36px); line-height: 1.2; margin-bottom: 12px; color: #0f172a; }
    .ltrk-blurb { color: var(--soft); font-size: 16px; margin-bottom: 10px; }
    .ltrk-suggest-link { display: inline-block; margin-bottom: 12px; font-size: 14px; color: var(--seal); font-weight: 500; text-decoration: none; }
    .ltrk-suggest-link:hover { text-decoration: underline; }

    /* Map Box & Tooltip */
    .ltrk-map-card {
      background: #f8fafc;
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      position: relative; /* Anchor for tooltip */
    }
    .ltrk-map-toggle {
      display: inline-flex;
      background: #e2e8f0;
      padding: 2px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .ltrk-map-toggle button {
      border: 0;
      background: transparent;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--soft);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .ltrk-map-toggle button[aria-pressed="true"] {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .ltrk-us-map {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Map Interactive Styles (Color Hierarchy) */
    .state-path {
      fill: #e2e8f0; /* Default Empty (Gray) */
      stroke: none;
      cursor: pointer;
      transition: fill 0.15s;
    }
    .state-path.is-hovered {
      fill: #cbd5e1; /* Hover Empty */
    }
    .state-path.has-cases {
      fill: #bfdbfe; /* Has Cases (Light Blue) */
    }
    .state-path.has-cases.is-hovered {
      fill: #93c5fd; /* Hover Has Cases */
    }
    .state-path.is-active {
      fill: var(--seal) !important; /* Active Selection (Dark Blue) */
    }
    .state-path.is-active.is-hovered {
      fill: #1d4ed8 !important; /* Hover Active Selection */
    }
    
    .ltrk-map-tooltip {
      position: absolute;
      background: #0f172a;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 50;
      white-space: nowrap;
      transform: translate(-50%, -130%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Controls */
    .ltrk-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
    .ltrk-search { flex: 1 1 280px; }
    .ltrk-search input { width: 100%; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 6px; font-size: 15px; background: #fff; }
    .ltrk-search input:focus { outline: none; border-color: var(--seal); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .ltrk select { padding: 10px 14px; border: 1px solid var(--rule); border-radius: 6px; font-size: 14px; cursor: pointer; background: #fff; }

    /* Status Bar & Timestamps */
    .ltrk-statusline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--soft); flex-wrap: wrap; gap: 8px; }
    .ltrk-timestamps { display: flex; gap: 16px; align-items: center; }
    
    .ltrk-tooltip-item {
      position: relative;
      cursor: help;
      border-bottom: 1px dotted var(--soft);
    }
    .ltrk-tooltip-item::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      right: 0;
      transform: translateX(0);
      background-color: #0f172a;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 10;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      pointer-events: none;
    }
    .ltrk-tooltip-item:hover::after {
      opacity: 1;
      visibility: visible;
    }

    /* Table */
    .ltrk-table { width: 100%; border-collapse: collapse; text-align: left; }
    .ltrk-table th { padding: 12px; border-bottom: 2px solid var(--rule); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--soft); white-space: nowrap; }
    .ltrk-th-btn { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; font-weight: inherit; }
    .ltrk-th-btn:hover { color: var(--seal); }
    .ltrk-th-btn[data-dir]::after { content: " ↑"; }
    .ltrk-th-btn[data-dir=desc]::after { content: " ↓"; }
    .ltrk-table td { padding: 16px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    .ltrk-row { cursor: pointer; transition: background-color 0.15s; }
    .ltrk-row:hover td { background: #f8fafc; }

    .ltrk-case { font-weight: 600; color: #0f172a; font-size: 16px; display: block; margin-bottom: 4px; }
    .ltrk-tag { font-size: 11px; padding: 2px 6px; background: #e2e8f0; border-radius: 4px; margin-left: 6px; font-weight: 500; color: #334155; }
    .ltrk-submeta { font-size: 13px; color: var(--soft); display: block; }
    .ltrk-statute-title { font-size: 15px; font-weight: 600; color: #1e293b; display: block; margin-bottom: 3px; }
    .ltrk-claims-text { font-size: 13px; color: var(--soft); display: block; }
    .ltrk-date { font-size: 14px; color: var(--soft); white-space: nowrap; }

    /* Prominent Long Status Box */
    .ltrk-status-box {
      background: #f1f5f9;
      border-left: 4px solid #3b82f6;
      padding: 14px 18px;
      margin-bottom: 20px;
      border-radius: 0 6px 6px 0;
      font-size: 16px;
      font-weight: 500;
      color: #0f172a;
      line-height: 1.5;
    }

    /* Superseded Section */
    .ltrk-superseded-header { margin: 48px 0 16px; border-top: 2px dashed var(--rule); padding-top: 32px; }
    .ltrk-superseded-header h3 { font-size: 18px; color: var(--ink); margin-bottom: 4px; font-weight: 600; }
    .ltrk-superseded-header p { font-size: 14px; color: var(--soft); }

    /* Expanded Details */
    .ltrk-detail td { background: #fafafa; padding: 24px 20px; border-bottom: 2px solid var(--rule); }
    .ltrk-dl { display: grid; grid-template-columns: minmax(150px, auto) 1fr; gap: 10px 24px; font-size: 14px; }
    .ltrk-dl dt { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--soft); padding-top: 2px; }
    .ltrk-detail a { color: var(--seal); text-decoration: none; font-weight: 500; }
    .ltrk-detail a:hover { text-decoration: underline; }

    .ltrk-msg { padding: 40px 20px; text-align: center; color: var(--soft); font-size: 15px; background: #fafafa; border-radius: 8px; border: 1px dashed var(--rule); }

    /* Low-Viz Footer */
    .ltrk-footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
      text-align: center;
      font-size: 13px;
      color: #94a3b8; /* Muted gray */
    }
    .ltrk-footer a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: #cbd5e1;
      transition: color 0.15s, text-decoration-color 0.15s;
    }
    .ltrk-footer a:hover {
      color: var(--seal);
      text-decoration-color: var(--seal);
    }

    @media (max-width: 820px) {
      .ltrk-header-grid { grid-template-columns: 1fr; }
      .ltrk-map-card { max-width: 400px; margin: 0 auto; }
      .ltrk-table thead { position: absolute; left: -9999px; }
      .ltrk-table, .ltrk-table tbody, .ltrk-table tr, .ltrk-table td { display: block; width: 100%; }
      .ltrk-table tr { border-bottom: 2px solid var(--rule); }
      .ltrk-table td { border: 0; padding: 10px 16px; }
      .ltrk-dl { grid-template-columns: 1fr; gap: 4px 0; }
      .ltrk-dl dd { margin-bottom: 12px; }
      .ltrk-statusline { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="ltrk">
  <div class="ltrk-wrap">
    
    <div class="ltrk-header-grid">
      <div>
        <h1 id="ltrk-title"></h1>
        <p class="ltrk-blurb" id="ltrk-blurb"></p>
        <a href="#" id="ltrk-suggest" class="ltrk-suggest-link" target="_blank" rel="noopener noreferrer"></a>
      </div>

      <!-- Interactive D3 Map Component -->
      <div class="ltrk-map-card" id="ltrk-map-container">
        <div class="ltrk-map-toggle">
          <button id="ltrk-map-mode-state" type="button" aria-pressed="true">States</button>
          <button id="ltrk-map-mode-circuit" type="button" aria-pressed="false">Circuits</button>
        </div>
        <svg id="ltrk-map-svg" class="ltrk-us-map" viewBox="0 0 975 610"></svg>
        <div id="ltrk-map-tooltip" class="ltrk-map-tooltip"></div>
      </div>
    </div>

    <div class="ltrk-controls" id="ltrk-controls" hidden>
      <div class="ltrk-search">
        <label class="ltrk-sr" for="ltrk-q">Search cases</label>
        <input id="ltrk-q" type="search" placeholder="Search case, statute, docket, notes..." autocomplete="off">
      </div>
      <select id="ltrk-f-state" aria-label="Filter by state"></select>
      <select id="ltrk-f-circuit" aria-label="Filter by circuit"></select>
    </div>

    <div class="ltrk-statusline" id="ltrk-statusline" hidden>
      <span id="ltrk-showing"></span>
      <div class="ltrk-timestamps">
        <span id="ltrk-checked-text" class="ltrk-tooltip-item" data-tooltip="All cases manually reviewed up through this date."></span>
        <span id="ltrk-synctext" class="ltrk-tooltip-item" data-tooltip="The last time this page successfully fetched data from my database."></span>
      </div>
    </div>

    <div id="ltrk-out" aria-live="polite">
      <div class="ltrk-msg">Loading tracker data...</div>
    </div>

    <!-- Low-Viz Footer -->
    <div class="ltrk-footer">
      <p style="margin-bottom: 12px;">
        This tracker was developed by <a href="https://brennanschaffner.com" target="_blank" rel="noopener noreferrer">Brennan Schaffner</a> while being supported as a <a href="https://techandsociety.georgetown.edu/projects/fritz-family-fellows-program/" target="_blank" rel="noopener noreferrer">Fritz Fellow</a> at <a href="https://kgi.georgetown.edu/" target="_blank" rel="noopener noreferrer">KGI</a> and <a href="https://cct.georgetown.edu/" target="_blank" rel="noopener noreferrer">CCT</a>, with substantial contribution from <a href="https://www.linkedin.com/in/arjunadriandsouza95/" target="_blank" rel="noopener noreferrer">Arjun D'Souza</a> and <a href="https://www.linkedin.com/in/sarahh-chao" target="_blank" rel="noopener noreferrer">Sarah Chao</a> and reliance on <a href="https://www.courtlistener.com/" target="_blank" rel="noopener noreferrer">CourtListener</a> by <a href="https://free.law/" target="_blank" rel="noopener noreferrer">Free Law Project</a>. All rights reserved.
      </p>
    </div>

  </div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG = {
    title: "Lawsuits Challenging Age Verification Laws in the US",
    blurb: "This regularly updated tracker includes all lawsuits challenging state statutes that require social media platforms to verify their users' ages. There may be more such laws that have passed than those included here; I only include them once they are challenged in federal court. As currently maintained, statutes targeting age verification on adult content platforms or app stores are excluded.",
    suggestionLink: "https://forms.gle/dV8JeVPAQ9C8w2Qx8",
    suggestionText: "Suggest an addition or edit",
    dataUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1XzokpCbqU2n-vr56u3q4oQJZ0rnd1MF8BuQ9JPp_IqxYJZRyVHNgnR63loG5Z6R3Ke7-2B63bsXx/pub?gid=1317314093&single=true&output=csv",
    cols: {
      caseName: "CASE ACTION",
      statute: "CHALLENGED STATUTE",
      dateFiled: "DATE FILED",
      claims: "COMPLAINT",
      shortStatus: "SHORT STATUS",
      status: "LONG STATUS",
      internalStatus: "Internal status",
      district: "DISTRICT",
      districtDocket: "DISTRICT DOCKET",
      districtUrl: "DISTRICT LINK",
      districtDecision: "DISTRICT DECISION",
      appealingParty: "APPEALING PARTY",
      circuit: "CIRCUIT",
      appealsDocket: "APPEALS DOCKET(S)",
      appealsUrl: "APPEALS LINK",
      circuitDecision: "CIRCUIT DECISION",
      scotusDocket: "SCOTUS DOCKET",
      scotusUrl: "SCOTUS LINK",
      scotusOpinion: "SCOTUS OPINION",
      notes: "NOTES",
      lastChecked: "Last Checked"
    },
    blanks: ["-", "-", "-", "n/a", "na", "none", "tbd"],
    dateLocale: "en-US"
  };

  var STATE_NAME_TO_ABBR = {
    "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR", "California": "CA",
    "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE", "Florida": "FL", "Georgia": "GA",
    "Hawaii": "HI", "Idaho": "ID", "Illinois": "IL", "Indiana": "IN", "Iowa": "IA",
    "Kansas": "KS", "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
    "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS", "Missouri": "MO",
    "Montana": "MT", "Nebraska": "NE", "Nevada": "NV", "New Hampshire": "NH", "New Jersey": "NJ",
    "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH",
    "Oklahoma": "OK", "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
    "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT", "Vermont": "VT",
    "Virginia": "VA", "Washington": "WA", "West Virginia": "WV", "Wisconsin": "WI", "Wyoming": "WY",
    "District of Columbia": "DC", "Puerto Rico": "PR", "Guam": "GU", "U.S. Virgin Islands": "VI", 
    "Northern Mariana Islands": "MP"
  };

  var CIRCUIT_MAP = {
    "1st Circuit Court of Appeals": ["ME", "NH", "MA", "RI", "PR"],
    "2nd Circuit Court of Appeals": ["VT", "NY", "CT"],
    "3rd Circuit Court of Appeals": ["PA", "NJ", "DE", "VI"],
    "4th Circuit Court of Appeals": ["MD", "VA", "WV", "NC", "SC"],
    "5th Circuit Court of Appeals": ["TX", "LA", "MS"],
    "6th Circuit Court of Appeals": ["MI", "OH", "KY", "TN"],
    "7th Circuit Court of Appeals": ["WI", "IL", "IN"],
    "8th Circuit Court of Appeals": ["ND", "SD", "NE", "MN", "IA", "MO", "AR"],
    "9th Circuit Court of Appeals": ["WA", "OR", "ID", "MT", "NV", "CA", "AZ", "AK", "HI", "GU", "MP"],
    "10th Circuit Court of Appeals": ["WY", "UT", "CO", "NM", "KS", "OK"],
    "11th Circuit Court of Appeals": ["AL", "GA", "FL"],
    "D.C. Circuit Court of Appeals": ["DC"]
  };

  var STATES = Object.keys(STATE_NAME_TO_ABBR);
  var $ = function (id) { return document.getElementById(id); };

  var headers = [], grid = [], idx = {}, records = [];
  var loadError = null, lastSync = null, usMapData = null;

  var state = { q: "", st: "", circ: "", sort: "dateFiled", dir: "desc", openKey: null, mapMode: "state" };

  function hash(s) {
    var h = 5381, i = s.length;
    while (i) h = (h * 33 ^ s.charCodeAt(--i)) >>> 0;
    return h.toString(36);
  }

  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, "");
    var out = [], row = [], f = "", i = 0, inQ = false, c;
    while (i < text.length) {
      c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { f += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        f += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ",") { row.push(f); f = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(f); out.push(row); row = []; f = ""; i++; continue; }
      f += c; i++;
    }
    if (f !== "" || row.length) { row.push(f); out.push(row); }
    return out;
  }

  function nonEmpty(g) {
    return g.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ""; }); });
  }

  function findHeaderRow(g) {
    var want = String(CONFIG.cols.caseName).toLowerCase();
    for (var i = 0; i < Math.min(g.length, 12); i++) {
      for (var j = 0; j < g[i].length; j++) {
        if (String(g[i][j]).trim().toLowerCase() === want) return i;
      }
    }
    return 0;
  }

  function buildIndex(hdrs) {
    var norm = hdrs.map(function (h) { return String(h).trim().toLowerCase(); });
    var m = {};
    Object.keys(CONFIG.cols).forEach(function (key) {
      var want = String(CONFIG.cols[key]).trim().toLowerCase();
      var i = norm.indexOf(want);
      if (i === -1) i = norm.findIndex(function (h) { return h ? h.indexOf(want) !== -1 : false; });
      if (i !== -1) m[key] = i;
    });
    return m;
  }

  function clean(s) {
    s = String(s == null ? "" : s).trim();
    return CONFIG.blanks.indexOf(s.toLowerCase()) !== -1 ? "" : s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim();
    var m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);
    if (m) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(d) {
    return d ? d.toLocaleDateString(CONFIG.dateLocale, { year: "numeric", month: "short", day: "numeric" }) : "-";
  }

  function stateOf(statute) {
    var s = String(statute || "").toLowerCase();
    for (var i = 0; i < STATES.length; i++) {
      if (s.indexOf(STATES[i].toLowerCase()) === 0) return STATES[i];
    }
    return "";
  }

  function url() {
    var u = CONFIG.dataUrl;
    return u + (u.indexOf("?") === -1 ? "?" : "&") + "_ts=" + Date.now();
  }

  function getCircuit(stateName) {
    var abbr = STATE_NAME_TO_ABBR[stateName];
    var targetCirc = null;
    Object.keys(CIRCUIT_MAP).forEach(function(circ) {
      if (CIRCUIT_MAP[circ].indexOf(abbr) !== -1) targetCirc = circ;
    });
    return targetCirc || "none";
  }

  /* D3 Map Rendering */
  function renderMapD3() {
    if (!usMapData) return;
    var svg = d3.select("#ltrk-map-svg");
    svg.selectAll("*").remove();

    var statesFeatures = topojson.feature(usMapData, usMapData.objects.states).features;
    statesFeatures = statesFeatures.filter(function(f) { return STATE_NAME_TO_ABBR[f.properties.name]; });

    var pathGen = d3.geoPath();
    var g = svg.append("g").attr("class", "map-states-group");

    // Standard geographic state paths
    g.selectAll("path.state-path")
     .data(statesFeatures)
     .enter()
     .append("path")
     .attr("class", "state-path")
     .attr("d", pathGen);

    // Proxy Box Definitions
    var proxyData = [
      { name: "District of Columbia", x: 935, y: 280, label: "DC", hasLine: true },
      { name: "Puerto Rico", x: 935, y: 335, label: "PR", hasLine: false },
      { name: "U.S. Virgin Islands", x: 935, y: 390, label: "VI", hasLine: false },
      { name: "Guam", x: 935, y: 445, label: "GU", hasLine: false },
      { name: "Northern Mariana Islands", x: 935, y: 500, label: "MP", hasLine: false }
    ];

    proxyData.forEach(function(loc) {
       var feature = statesFeatures.filter(function(f) { return f.properties.name === loc.name; })[0];
       if (!feature) {
         feature = { properties: { name: loc.name } };
       }

       var gProxy = svg.append("g").attr("class", "proxy-group");

       if (loc.hasLine && feature.geometry) {
         var centroid = pathGen.centroid(feature);
         gProxy.append("line")
            .attr("x1", centroid[0]).attr("y1", centroid[1])
            .attr("x2", loc.x).attr("y2", loc.y)
